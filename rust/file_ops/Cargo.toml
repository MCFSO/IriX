[package]
name = "xmc_file_ops"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5"
chrono = "0.4"
# 与 backup 共用 flate2 的 zlib-ng 后端，避免重复引入 miniz_oxide
zip = { version = "2", default-features = false, features = ["deflate-zlib-ng"] }
base64 = "0.22"
