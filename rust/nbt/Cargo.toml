[package]
name = "xmc_nbt"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
libc = "0.2"
# 纯 Rust gzip 实现（miniz_oxide 后端），无 C 链接、无 OpenSSL。
# 用于读取/写出 Minecraft 的 .nbt（NbtIo.writeCompressed = gzip 包裹 NBT）。
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
