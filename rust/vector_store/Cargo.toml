[package]
name = "xmc_vector_store"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
libc = "0.2"
# 远程向量数据库 Milvus（官方 Rust SDK，纯 rustls、无 OpenSSL）。
# 替代原本地 SQLite + sqlite-vec 方案，所有向量存取走 Milvus 服务端。
milvus-sdk-rust = "2.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
