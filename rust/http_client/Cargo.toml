[package]
name = "xmc_http_client"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
libc = "0.2"
# 纯 Rust HTTP 客户端 (无 OpenSSL 依赖)，使用 rustls 后端
# tls 特性启用 HTTPS 支持；禁用默认特性避免引入 charset/encoding 等多余功能
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
# 响应头/结果以 JSON 传递，响应体以 base64 传递（保证二进制安全）
serde_json = "1"
base64 = "0.22"
