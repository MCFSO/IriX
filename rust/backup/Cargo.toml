[package]
name = "xmc_backup"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
rayon = "1"
# 用 zlib-ng 后端 (C 库, 含 SSE2/AVX2 优化的 deflate, 运行时 cpuid 检测并自动降级)
flate2 = { version = "1", default-features = false, features = ["zlib-ng"] }
# crc32fast 默认在 stable 上用 PCLMULQDQ (运行时 is_x86_feature_detected! 检测) 加速 CRC32
crc32fast = "1"
walkdir = "2.5"
libc = "0.2"
# 备份仓库的清单/元数据 JSON（与 Dart 侧 FFI 约定字段，camelCase）
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Windows 增量备份：文件内容 SHA-256（内容寻址存储的对象键）
sha2 = "0.10"
# 全量备份恢复（ZIP 解包）。与 file_ops 共用同一 deflate 后端，避免重复引入 miniz_oxide
zip = { version = "2", default-features = false, features = ["deflate-zlib-ng"] }
