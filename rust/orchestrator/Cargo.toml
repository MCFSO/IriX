[package]
name = "xmc_orchestrator"
version = "0.1.0"
edition = "2021"
description = "K8s 风格 MC 服务器编排引擎：期望状态对账、崩溃自愈、按在线人数弹性扩缩容、跨物理机存档迁移、调度器"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLite（bundled）持久化服务/副本/迁移任务状态。
# 0.38 起 rusqlite 的 hashlink 依赖升级到 ^0.11（含修复 IterMut 内存安全缺陷的 0.11.1），
# 消除 RUSTSEC 告警（0.10.x 仅有未修复的 0.10.0）。
rusqlite = { version = "0.38", features = ["bundled"] }
# 钉到经过安全修复的 hashlink 版本（0.11.1）。
hashlink = "=0.11.1"
