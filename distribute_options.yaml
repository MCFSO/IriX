output: dist/
releases:
  - name: release
    jobs:
      # ── Linux ──
      - name: release-linux-appimage
        package:
          platform: linux
          target: appimage
          build_args:
            target-platform: linux-x64

      - name: release-linux-deb
        package:
          platform: linux
          target: deb
          build_args:
            target-platform: linux-x64

      - name: release-linux-rpm
        package:
          platform: linux
          target: rpm
          build_args:
            target-platform: linux-x64

      # ── macOS ──
      - name: release-macos-dmg
        package:
          platform: macos
          target: dmg

      # ── Windows ──
      - name: release-windows-exe
        package:
          platform: windows
          target: exe

      - name: release-windows-msix
        package:
          platform: windows
          target: msix
