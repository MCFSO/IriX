#:schema node_modules/wrangler/config-schema.json
name = "irix-update-feed"
main = "src/index.js"
compatibility_date = "2025-09-01"

# 部署后把 https://irix-update-feed.<你的子域>.workers.dev 填进
# IriX「设置 → 软件更新 → 更新源」，或构建时内置：
#   flutter build windows --release --dart-define=IRIX_UPDATE_FEED=https://<域名>
# 也可以绑定自己的域名（Workers → Settings → Domains & Routes）。
workers_dev = true

[vars]
GITHUB_OWNER = "MCFSO"
GITHUB_REPO = "IriX"
# Releases 列表缓存秒数（GitHub 未认证限额 60/小时，缓存能显著降低调用量）
CACHE_TTL = "300"
PER_PAGE = "30"
# 安装包边缘缓存；设为 "0" 可以关闭（大文件首次回源会慢一些）
CACHE_DOWNLOADS = "1"

# GITHUB_TOKEN 用 secret 配，不要写进这个文件：
#   npx wrangler secret put GITHUB_TOKEN
# 填了可把 GitHub API 限额从 60/小时 提到 5000/小时（只读公共仓库的 fine-grained token 即可）。

# 想让 Worker 自己托管安装包（而不是代理 GitHub）时启用 R2：
# 对象键名格式为 <tag>/<asset 文件名>，例如
#   Stable-v1.3.0/irix-1.3.0-windows-x64.exe
# 上传示例（GitHub Release 资产下载到本地后）：
#   npx wrangler r2 object put irix-releases/Stable-v1.3.0/irix-1.3.0-windows-x64.exe --file ./irix-1.3.0-windows-x64.exe
# 有同名对象时优先走 R2，没有则回落到 GitHub 代理，两种方式可以并存。
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "irix-releases"
