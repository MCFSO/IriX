name: Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-windows:
    name: Package Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup MSVC C compiler
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build Rust library
        run: |
          cd rust
          cargo build --release

      - name: Copy Rust DLL
        run: |
          Copy-Item rust/target/release/xmc_backup.dll windows/runner/ -Force
          Copy-Item rust/target/release/xmc_downloader.dll windows/runner/ -Force
          Copy-Item rust/target/release/xmc_file_ops.dll windows/runner/ -Force
          Copy-Item rust/target/release/xmc_logger.dll windows/runner/ -Force
          Copy-Item rust/target/release/xmc_http_client.dll windows/runner/ -Force
          Copy-Item rust/target/release/xmc_db_client.dll windows/runner/ -Force
          Copy-Item rust/target/release/xmc_vector_store.dll windows/runner/ -Force
          Copy-Item rust/target/release/xmc_orchestrator.dll windows/runner/ -Force
          Copy-Item rust/target/release/xmc_nbt.dll windows/runner/ -Force
          Copy-Item rust/target/release/xmc_devlog.dll windows/runner/ -Force

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Install Fastforge
        run: dart pub global activate fastforge

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Package EXE
        run: fastforge package --platform windows --targets exe

      - name: Package MSIX
        run: fastforge package --platform windows --targets msix

      # fastforge 打包前会先 flutter clean 再重建（--[no-]skip-clean 默认 clean），
      # 所以往 build 目录里手工补动态库是无效的：产物里的 xmc_*.dll 完全由
      # windows/runner/CMakeLists.txt 的复制规则决定。这里在打包之后校验一次，
      # 缺任何一个都让流水线失败，避免又发出“能装但缺功能”的安装包
      # （v1.2.0 只带了 3 个 xmc_*.dll，市场页面直接报 Rust http_client library not found）。
      - name: Verify FFI DLLs in packaged bundle
        run: dart tool/ffi_dlls.dart bundle build/windows/x64/runner/Release --ext .dll

      - name: Upload Windows packages
        uses: actions/upload-artifact@v5
        with:
          name: windows-packages
          path: dist/
          retention-days: 30

  package-linux:
    name: Package Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgtk-3-dev liblzma-dev libstdc++-12-dev libxdo-dev rpm libfuse2

      - name: Install appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          chmod +x /usr/local/bin/appimagetool

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build Rust library
        run: |
          cd rust
          cargo build --release

      - name: Copy Rust so
        run: |
          mkdir -p linux
          cp rust/target/release/libxmc_backup.so linux/
          cp rust/target/release/libxmc_downloader.so linux/
          cp rust/target/release/libxmc_file_ops.so linux/
          cp rust/target/release/libxmc_logger.so linux/
          cp rust/target/release/libxmc_http_client.so linux/
          cp rust/target/release/libxmc_db_client.so linux/
          cp rust/target/release/libxmc_vector_store.so linux/
          cp rust/target/release/libxmc_orchestrator.so linux/
          cp rust/target/release/libxmc_nbt.so linux/
          cp rust/target/release/libxmc_devlog.so linux/

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Install Fastforge
        run: dart pub global activate fastforge

      - name: Package AppImage
        run: fastforge package --platform linux --targets appimage

      - name: Package DEB
        run: fastforge package --platform linux --targets deb

      - name: Package RPM
        run: fastforge package --platform linux --targets rpm

      # 同 Windows：fastforge 会先 flutter clean 再重建，bundle/lib 里的
      # libxmc_*.so 由 linux/CMakeLists.txt 的安装规则决定（缺库直接构建失败）。
      # 这里在打包后复核产物，缺任何一个都让流水线失败。
      - name: Verify FFI libraries in packaged bundle
        run: dart tool/ffi_dlls.dart bundle build/linux/x64/release/bundle/lib --ext .so --prefix libxmc_

      - name: Upload Linux packages
        uses: actions/upload-artifact@v5
        with:
          name: linux-packages
          path: dist/
          retention-days: 30

  package-macos:
    name: Package macOS
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Setup C compiler and build tools
        run: brew install cmake

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build Rust library (x86_64)
        run: |
          cd rust
          cargo build --release --target x86_64-apple-darwin

      - name: Build Rust library (aarch64)
        run: |
          cd rust
          cargo build --release --target aarch64-apple-darwin

      - name: Create universal dylib
        run: |
          mkdir -p macos
          lipo -create \
            rust/target/x86_64-apple-darwin/release/libxmc_backup.dylib \
            rust/target/aarch64-apple-darwin/release/libxmc_backup.dylib \
            -output macos/libxmc_backup.dylib
          lipo -create \
            rust/target/x86_64-apple-darwin/release/libxmc_downloader.dylib \
            rust/target/aarch64-apple-darwin/release/libxmc_downloader.dylib \
            -output macos/libxmc_downloader.dylib
          lipo -create \
            rust/target/x86_64-apple-darwin/release/libxmc_file_ops.dylib \
            rust/target/aarch64-apple-darwin/release/libxmc_file_ops.dylib \
            -output macos/libxmc_file_ops.dylib
          lipo -create \
            rust/target/x86_64-apple-darwin/release/libxmc_logger.dylib \
            rust/target/aarch64-apple-darwin/release/libxmc_logger.dylib \
            -output macos/libxmc_logger.dylib
          lipo -create \
            rust/target/x86_64-apple-darwin/release/libxmc_http_client.dylib \
            rust/target/aarch64-apple-darwin/release/libxmc_http_client.dylib \
            -output macos/libxmc_http_client.dylib
          lipo -create \
            rust/target/x86_64-apple-darwin/release/libxmc_db_client.dylib \
            rust/target/aarch64-apple-darwin/release/libxmc_db_client.dylib \
            -output macos/libxmc_db_client.dylib
          lipo -create \
            rust/target/x86_64-apple-darwin/release/libxmc_vector_store.dylib \
            rust/target/aarch64-apple-darwin/release/libxmc_vector_store.dylib \
            -output macos/libxmc_vector_store.dylib
          lipo -create \
            rust/target/x86_64-apple-darwin/release/libxmc_orchestrator.dylib \
            rust/target/aarch64-apple-darwin/release/libxmc_orchestrator.dylib \
            -output macos/libxmc_orchestrator.dylib
          lipo -create \
            rust/target/x86_64-apple-darwin/release/libxmc_nbt.dylib \
            rust/target/aarch64-apple-darwin/release/libxmc_nbt.dylib \
            -output macos/libxmc_nbt.dylib
          lipo -create \
            rust/target/x86_64-apple-darwin/release/libxmc_devlog.dylib \
            rust/target/aarch64-apple-darwin/release/libxmc_devlog.dylib \
            -output macos/libxmc_devlog.dylib

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Install Fastforge
        run: dart pub global activate fastforge

      - name: Install appdmg
        run: npm install -g appdmg

      - name: Package DMG
        run: fastforge package --platform macos --targets dmg

      # 同 Windows：fastforge 会先 flutter clean 再重建，app 包里的 dylib 由
      # macos/Runner.xcodeproj 的 “Copy Rust FFI dylibs” 构建阶段决定。
      # 这里在打包后复核产物，缺任何一个都让流水线失败。
      - name: Verify FFI libraries in packaged bundle
        run: dart tool/ffi_dlls.dart bundle build/macos/Build/Products/Release/lrix.app/Contents/MacOS --ext .dylib --prefix libxmc_

      - name: Upload macOS packages
        uses: actions/upload-artifact@v5
        with:
          name: macos-packages
          path: dist/
          retention-days: 30
