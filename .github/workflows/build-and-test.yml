name: Build and Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build Rust library
        run: |
          cd rust
          cargo build --release

      - name: Copy Rust so (for FFI tests)
        run: |
          mkdir -p linux
          cp rust/target/release/libxmc_backup.so linux/
          cp rust/target/release/libxmc_downloader.so linux/
          cp rust/target/release/libxmc_file_ops.so linux/
          cp rust/target/release/libxmc_logger.so linux/
          cp rust/target/release/libxmc_http_client.so linux/
          cp rust/target/release/libxmc_db_client.so linux/
          cp rust/target/release/libxmc_vector_store.so linux/
          cp rust/target/release/libxmc_orchestrator.so linux/
          cp rust/target/release/libxmc_nbt.so linux/

      - name: Get dependencies
        run: flutter pub get

      # package:sqlite3 3.x ships a build hook that downloads a prebuilt
      # libsqlite3.so from github.com/simolus3/sqlite3.dart releases with no
      # timeout/retry/status check, and fails the whole build on any network
      # hiccup (seen as "Building assets for package:sqlite3 failed" /
      # "HttpException: Connection closed before full header was received").
      # Pre-seeding the hook's shared cache (verified by its SHA-256) makes the
      # build skip the download. Update the download-<hash8> dir and URL when
      # sqlite3 is bumped: hash = first 8 chars of the asset's sha256 (see the
      # package's lib/src/hook/asset_hashes.dart).
      - name: Pre-seed sqlite3 hook asset
        run: |
          mkdir -p .dart_tool/hooks_runner/shared/sqlite3/build/download-2219febf
          curl -fL --retry 5 --retry-all-errors \
            -o .dart_tool/hooks_runner/shared/sqlite3/build/download-2219febf/libsqlite3.so \
            https://github.com/simolus3/sqlite3.dart/releases/download/sqlite3-3.5.0/libsqlite3.x64.linux.so

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Rust tests
        run: cd rust && cargo test --release

      - name: Run Dart tests
        run: flutter test --coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: analyze-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup MSVC C compiler
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build Rust library
        run: |
          cd rust
          cargo build --release

      - name: Copy Rust DLL
        run: |
          Copy-Item rust/target/release/xmc_backup.dll windows/runner/ -Force
          Copy-Item rust/target/release/xmc_downloader.dll windows/runner/ -Force
          Copy-Item rust/target/release/xmc_file_ops.dll windows/runner/ -Force
          Copy-Item rust/target/release/xmc_logger.dll windows/runner/ -Force
          Copy-Item rust/target/release/xmc_http_client.dll windows/runner/ -Force
          Copy-Item rust/target/release/xmc_db_client.dll windows/runner/ -Force
          Copy-Item rust/target/release/xmc_vector_store.dll windows/runner/ -Force
          Copy-Item rust/target/release/xmc_orchestrator.dll windows/runner/ -Force
          Copy-Item rust/target/release/xmc_nbt.dll windows/runner/ -Force

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # Pre-seed the sqlite3 hook's shared cache; see the same step in the
      # analyze-and-test job for why.
      - name: Pre-seed sqlite3 hook asset
        shell: bash
        run: |
          mkdir -p .dart_tool/hooks_runner/shared/sqlite3/build/download-858141a2
          curl -fL --retry 5 --retry-all-errors \
            -o .dart_tool/hooks_runner/shared/sqlite3/build/download-858141a2/sqlite3.dll \
            https://github.com/simolus3/sqlite3.dart/releases/download/sqlite3-3.5.0/sqlite3.x64.windows.dll

      - name: Build Windows
        run: flutter build windows --release

      - name: Dump hook logs (diagnostic)
        if: failure()
        run: |
          find .dart_tool/hooks_runner -type f \( -name 'stdout.txt' -o -name 'stderr.txt' \) \
            -exec sh -c 'echo "=== $1 ==="; cat "$1"' _ {} \;

      - name: Copy Rust DLL to build output
        run: |
          Copy-Item windows/runner/xmc_backup.dll build/windows/x64/runner/Release/ -Force
          Copy-Item windows/runner/xmc_downloader.dll build/windows/x64/runner/Release/ -Force
          Copy-Item windows/runner/xmc_file_ops.dll build/windows/x64/runner/Release/ -Force
          Copy-Item windows/runner/xmc_logger.dll build/windows/x64/runner/Release/ -Force
          Copy-Item windows/runner/xmc_http_client.dll build/windows/x64/runner/Release/ -Force
          Copy-Item windows/runner/xmc_db_client.dll build/windows/x64/runner/Release/ -Force
          Copy-Item windows/runner/xmc_vector_store.dll build/windows/x64/runner/Release/ -Force
          Copy-Item windows/runner/xmc_orchestrator.dll build/windows/x64/runner/Release/ -Force
          Copy-Item windows/runner/xmc_nbt.dll build/windows/x64/runner/Release/ -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v5
        with:
          name: windows-build
          path: build/windows/x64/runner/Release/
          retention-days: 30

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgtk-3-dev liblzma-dev libstdc++-12-dev libxdo-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build Rust library
        run: |
          cd rust
          cargo build --release

      - name: Copy Rust so
        run: |
          mkdir -p linux
          cp rust/target/release/libxmc_backup.so linux/
          cp rust/target/release/libxmc_downloader.so linux/
          cp rust/target/release/libxmc_file_ops.so linux/
          cp rust/target/release/libxmc_logger.so linux/
          cp rust/target/release/libxmc_http_client.so linux/
          cp rust/target/release/libxmc_db_client.so linux/
          cp rust/target/release/libxmc_vector_store.so linux/
          cp rust/target/release/libxmc_orchestrator.so linux/
          cp rust/target/release/libxmc_nbt.so linux/

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # package:sqlite3 3.x ships a build hook that downloads a prebuilt
      # libsqlite3.so from github.com/simolus3/sqlite3.dart releases with no
      # timeout/retry/status check, and fails the whole build on any network
      # hiccup (seen as "Building assets for package:sqlite3 failed").
      # Pre-seeding the hook's shared cache (verified by its SHA-256) makes the
      # build skip the download. Update the download-<hash8> dir and URL when
      # sqlite3 is bumped: hash = first 8 chars of libsqlite3.x64.linux.so's
      # sha256 (see package's lib/src/hook/asset_hashes.dart).
      - name: Pre-seed sqlite3 hook asset
        run: |
          mkdir -p .dart_tool/hooks_runner/shared/sqlite3/build/download-2219febf
          curl -fL --retry 5 --retry-all-errors \
            -o .dart_tool/hooks_runner/shared/sqlite3/build/download-2219febf/libsqlite3.so \
            https://github.com/simolus3/sqlite3.dart/releases/download/sqlite3-3.5.0/libsqlite3.x64.linux.so

      - name: Build Linux
        run: flutter build linux --release

      - name: Dump hook logs (diagnostic)
        if: failure()
        run: |
          find .dart_tool/hooks_runner -type f \( -name 'stdout.txt' -o -name 'stderr.txt' \) \
            -exec sh -c 'echo "=== $1 ==="; cat "$1"' _ {} \;

      - name: Copy Rust so to bundle
        run: |
          mkdir -p build/linux/x64/release/bundle/lib
          cp linux/libxmc_backup.so build/linux/x64/release/bundle/lib/
          cp linux/libxmc_downloader.so build/linux/x64/release/bundle/lib/
          cp linux/libxmc_file_ops.so build/linux/x64/release/bundle/lib/
          cp linux/libxmc_logger.so build/linux/x64/release/bundle/lib/
          cp linux/libxmc_http_client.so build/linux/x64/release/bundle/lib/
          cp linux/libxmc_db_client.so build/linux/x64/release/bundle/lib/
          cp linux/libxmc_vector_store.so build/linux/x64/release/bundle/lib/
          cp linux/libxmc_orchestrator.so build/linux/x64/release/bundle/lib/
          cp linux/libxmc_nbt.so build/linux/x64/release/bundle/lib/

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v5
        with:
          name: linux-build
          path: build/linux/x64/release/bundle/
          retention-days: 30

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: analyze-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Setup C compiler and build tools
        run: brew install cmake

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build Rust library (x86_64)
        run: |
          cd rust
          cargo build --release --target x86_64-apple-darwin

      - name: Build Rust library (aarch64)
        run: |
          cd rust
          cargo build --release --target aarch64-apple-darwin

      - name: Create universal dylib
        run: |
          mkdir -p macos
          lipo -create \
            rust/target/x86_64-apple-darwin/release/libxmc_backup.dylib \
            rust/target/aarch64-apple-darwin/release/libxmc_backup.dylib \
            -output macos/libxmc_backup.dylib
          lipo -create \
            rust/target/x86_64-apple-darwin/release/libxmc_downloader.dylib \
            rust/target/aarch64-apple-darwin/release/libxmc_downloader.dylib \
            -output macos/libxmc_downloader.dylib
          lipo -create \
            rust/target/x86_64-apple-darwin/release/libxmc_file_ops.dylib \
            rust/target/aarch64-apple-darwin/release/libxmc_file_ops.dylib \
            -output macos/libxmc_file_ops.dylib
          lipo -create \
            rust/target/x86_64-apple-darwin/release/libxmc_logger.dylib \
            rust/target/aarch64-apple-darwin/release/libxmc_logger.dylib \
            -output macos/libxmc_logger.dylib
          lipo -create \
            rust/target/x86_64-apple-darwin/release/libxmc_http_client.dylib \
            rust/target/aarch64-apple-darwin/release/libxmc_http_client.dylib \
            -output macos/libxmc_http_client.dylib
          lipo -create \
            rust/target/x86_64-apple-darwin/release/libxmc_db_client.dylib \
            rust/target/aarch64-apple-darwin/release/libxmc_db_client.dylib \
            -output macos/libxmc_db_client.dylib
          lipo -create \
            rust/target/x86_64-apple-darwin/release/libxmc_vector_store.dylib \
            rust/target/aarch64-apple-darwin/release/libxmc_vector_store.dylib \
            -output macos/libxmc_vector_store.dylib
          lipo -create \
            rust/target/x86_64-apple-darwin/release/libxmc_orchestrator.dylib \
            rust/target/aarch64-apple-darwin/release/libxmc_orchestrator.dylib \
            -output macos/libxmc_orchestrator.dylib
          lipo -create \
            rust/target/x86_64-apple-darwin/release/libxmc_nbt.dylib \
            rust/target/aarch64-apple-darwin/release/libxmc_nbt.dylib \
            -output macos/libxmc_nbt.dylib

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # Pre-seed the sqlite3 hook's shared cache; see the same step in the
      # analyze-and-test job for why. Both architectures are seeded in case
      # macos-latest flips between arm64 and x64.
      - name: Pre-seed sqlite3 hook asset
        run: |
          mkdir -p .dart_tool/hooks_runner/shared/sqlite3/build/download-f84bea51 \
                   .dart_tool/hooks_runner/shared/sqlite3/build/download-bd96fb24
          curl -fL --retry 5 --retry-all-errors \
            -o .dart_tool/hooks_runner/shared/sqlite3/build/download-f84bea51/libsqlite3.dylib \
            https://github.com/simolus3/sqlite3.dart/releases/download/sqlite3-3.5.0/libsqlite3.arm64.macos.dylib
          curl -fL --retry 5 --retry-all-errors \
            -o .dart_tool/hooks_runner/shared/sqlite3/build/download-bd96fb24/libsqlite3.dylib \
            https://github.com/simolus3/sqlite3.dart/releases/download/sqlite3-3.5.0/libsqlite3.x64.macos.dylib

      - name: Build macOS
        run: flutter build macos --release

      - name: Dump hook logs (diagnostic)
        if: failure()
        run: |
          find .dart_tool/hooks_runner -type f \( -name 'stdout.txt' -o -name 'stderr.txt' \) \
            -exec sh -c 'echo "=== $1 ==="; cat "$1"' _ {} \;

      - name: Copy Rust dylib to app bundle
        run: |
          mkdir -p build/macos/Build/Products/Release/lrix.app/Contents/Frameworks
          cp macos/libxmc_backup.dylib build/macos/Build/Products/Release/lrix.app/Contents/Frameworks/
          cp macos/libxmc_downloader.dylib build/macos/Build/Products/Release/lrix.app/Contents/Frameworks/
          cp macos/libxmc_file_ops.dylib build/macos/Build/Products/Release/lrix.app/Contents/Frameworks/
          cp macos/libxmc_logger.dylib build/macos/Build/Products/Release/lrix.app/Contents/Frameworks/
          cp macos/libxmc_http_client.dylib build/macos/Build/Products/Release/lrix.app/Contents/Frameworks/
          cp macos/libxmc_db_client.dylib build/macos/Build/Products/Release/lrix.app/Contents/Frameworks/
          cp macos/libxmc_vector_store.dylib build/macos/Build/Products/Release/lrix.app/Contents/Frameworks/
          cp macos/libxmc_orchestrator.dylib build/macos/Build/Products/Release/lrix.app/Contents/Frameworks/
          cp macos/libxmc_nbt.dylib build/macos/Build/Products/Release/lrix.app/Contents/Frameworks/

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v5
        with:
          name: macos-build
          path: build/macos/Build/Products/Release/lrix.app
          retention-days: 30
