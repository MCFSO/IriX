name: Build and Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Dart tests
        run: flutter test --coverage

      - name: Run Rust tests
        run: cd rust && cargo test --release

      - name: Upload coverage reports
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: analyze-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup MSVC C compiler
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build Rust library
        run: |
          cd rust
          cargo build --release

      - name: Copy Rust DLL
        run: |
          Copy-Item rust/target/release/xmc_backup.dll windows/runner/ -Force
          Copy-Item rust/target/release/xmc_downloader.dll windows/runner/ -Force
          Copy-Item rust/target/release/xmc_file_ops.dll windows/runner/ -Force

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Copy Rust DLL to build output
        run: |
          Copy-Item windows/runner/xmc_backup.dll build/windows/x64/runner/Release/ -Force
          Copy-Item windows/runner/xmc_downloader.dll build/windows/x64/runner/Release/ -Force
          Copy-Item windows/runner/xmc_file_ops.dll build/windows/x64/runner/Release/ -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v5
        with:
          name: windows-build
          path: build/windows/x64/runner/Release/
          retention-days: 30

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgtk-3-dev liblzma-dev libstdc++-12-dev libxdo-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build Rust library
        run: |
          cd rust
          cargo build --release

      - name: Copy Rust so
        run: |
          mkdir -p linux
          cp rust/target/release/libxmc_backup.so linux/
          cp rust/target/release/libxmc_downloader.so linux/
          cp rust/target/release/libxmc_file_ops.so linux/

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v5
        with:
          name: linux-build
          path: build/linux/x64/release/bundle/
          retention-days: 30

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: analyze-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Setup C compiler and build tools
        run: brew install cmake

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build Rust library (x86_64)
        run: |
          cd rust
          cargo build --release --target x86_64-apple-darwin

      - name: Build Rust library (aarch64)
        run: |
          cd rust
          cargo build --release --target aarch64-apple-darwin

      - name: Create universal dylib
        run: |
          mkdir -p macos
          lipo -create \
            rust/target/x86_64-apple-darwin/release/libxmc_backup.dylib \
            rust/target/aarch64-apple-darwin/release/libxmc_backup.dylib \
            -output macos/libxmc_backup.dylib
          lipo -create \
            rust/target/x86_64-apple-darwin/release/libxmc_downloader.dylib \
            rust/target/aarch64-apple-darwin/release/libxmc_downloader.dylib \
            -output macos/libxmc_downloader.dylib
          lipo -create \
            rust/target/x86_64-apple-darwin/release/libxmc_file_ops.dylib \
            rust/target/aarch64-apple-darwin/release/libxmc_file_ops.dylib \
            -output macos/libxmc_file_ops.dylib

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v5
        with:
          name: macos-build
          path: build/macos/Build/Products/Release/xmcserverlauncher.app
          retention-days: 30
